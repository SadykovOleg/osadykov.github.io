- title: "Чек-лист «6 цифр вашей финансовой точки старта»"
  text: "Заполняется за 5 минут: возраст, срок до цели, желаемая сумма, текущие накопления, обязательные расходы, сумма, которую реально можно откладывать."
- title: "План на 7 дней «От тревоги к ясности»"
  text: "Одна небольшая задача в день — от «я не знаю, с чего начать» до полной картины своей ситуации: расходы, подушка, кредиты, срок до цели."
- title: "Гайд «10 вопросов перед любым финансовым решением»"
  text: "Что спросить у любого консультанта или банка, прежде чем довериться, и какие ответы должны насторожить."
