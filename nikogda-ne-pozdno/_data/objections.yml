- q: "Дорого, а гарантий нет"
  a: "Гарантий на доходность рынка не даст никто честный — если вам их дают, это повод насторожиться. Но я гарантирую результат самой встречи: если вы не получите письменный расчёт с конкретными цифрами — верну деньги полностью в течение 7 дней. Материалы остаются у вас в любом случае."
- q: "У меня уже есть банк или консультант"
  a: "Возможно, текущий консультант получает комиссию от банка или брокера за рекомендованный продукт. Я работаю иначе: оплата фиксированная и не зависит от того, что вы выберете. Расчёт можно использовать и как независимую проверку того, что вам уже посоветовали."
- q: "У меня уже есть портфель, я не начинаю с нуля"
  a: "Расчёт учитывает и это — существующие вложения встраиваются в общую картину как часть текущего капитала. Разбираем не только новые взносы, но и то, работает ли на вашу цель то, что уже вложено."
- q: "Нет свободных денег на старт"
  a: "Расчёт строится от вашей реальной стартовой суммы, даже минимальной или нулевой. Один из бесплатных материалов — чек-лист с вашей точкой старта — работает независимо от суммы."
- q: "Боюсь, что не хватит дисциплины"
  a: "Большинство планов проваливаются не из-за ошибки в расчёте, а потому что план забрасывается через несколько месяцев. Поэтому в структуре встречи есть контроль на 3, 6 и 12 месяцев — дисциплина держится на регулярной внешней сверке, а не на силе воли."
- q: "Мне уже поздно начинать"
  a: "Расчёт всегда строится от вашей сегодняшней точки. Даже при старте в 45–50 лет есть реалистичный маршрут — он будет выглядеть иначе, с другим соотношением пути «тратить капитал» и пути «жить с процентов»."
- q: "А если окажется, что цель нереалистична"
  a: "Такое бывает, и я скажу это прямо. Если 100 000 ₽/мес недостижимы к желаемому сроку — вы услышите реалистичную альтернативу: другую сумму, другой срок или другое сочетание путей. Расчёт существует, чтобы вы приняли решение на основе фактов."
